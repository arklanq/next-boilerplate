# Bun is the only runtime: `bun run` executes package binaries with `#!/usr/bin/env node`
# shebangs (next, eslint, playwright, ...) under Bun instead of Node.js.
[run]
bun = true

[test]
root = "tests/unit"
preload = ["./tests/unit/setup.ts"]

# `bun fmt` follows Prettier's defaults; these are the project's differences.
[fmt]
printWidth = 120
trailingComma = "none"
experimentalTernaries = true
