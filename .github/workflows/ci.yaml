name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run type:check

      - name: Lint
        run: bun run lint:check

      - name: Build
        run: bun run build

  unit-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Run unit tests with coverage
        run: bun run test:unit --coverage --bail=1 --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/unit.json

      - name: Upload Vitest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vitest-report-unit
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  e2e-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser test
        run: bun run test:e2e

  coverage-report:
    runs-on: ubuntu-26.04
    if: ${{ !cancelled() }}
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Download Vitest reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: .vitest-reports
          pattern: vitest-report-*
          merge-multiple: true

      - name: Merge test and coverage reports
        run: bun --bun vitest --merge-reports=.vitest-reports --coverage

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 5

      - name: Write coverage to Step Summary
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73  # v2.13.0
        with:
          comment-on: none
          file-coverage-mode: none

  gate:
    runs-on: ubuntu-26.04
    if: always()
    needs: [quality, unit-tests, e2e-tests, coverage-report]
    steps:
      - name: Write CI manifest to Step Summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "### CI Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | \`${GITHUB_EVENT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "| PR | #${PR_NUMBER} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Branch | \`${GITHUB_HEAD_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Base | \`${GITHUB_BASE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Author | @${PR_AUTHOR} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Triggered by | @${GITHUB_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Commit | \`${HEAD_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Job Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| quality | \`${{ needs.quality.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit-tests | \`${{ needs.unit-tests.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| e2e-tests | \`${{ needs.e2e-tests.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage-report | \`${{ needs.coverage-report.result }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required jobs
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.e2e-tests.result }}" = "success"
          test "${{ needs.coverage-report.result }}" = "success"
